name: Full Stack CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Backend
    - name: Install Backend Dependencies
      run: npm install

    # Frontend
    - name: Install Frontend Dependencies
      run: |
        cd my-app
        npm install

    - name: Build Frontend
      run: |
        cd my-app
        npm run build
